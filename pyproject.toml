[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ledger"
version = "0.1.0"
description = "Apex Financial Services — Agentic Event Store & Audit Infrastructure"
requires-python = ">=3.11"

dependencies = [
    "asyncpg>=0.29",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "mcp>=1.0",           # Phase 5: MCP server
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "coverage[toml]>=7.4",
]
dev = [
    "ruff>=0.3",
    "mypy>=1.9",
    "ipython",
]

# ── pytest ─────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode        = "auto"          # no @pytest.mark.asyncio needed on every test
testpaths           = ["tests"]
python_files        = ["test_*.py"]
python_classes      = ["Test*"]
python_functions    = ["test_*"]
addopts             = "-v --tb=short --strict-markers"

markers = [
    "unit: no database required — pure Python domain logic",
    "integration: requires running PostgreSQL (ledger-test-db on 5433)",
    "e2e: full stack — all services must be running",
    "graded: assessed independently by evaluator",
]

# ── coverage ───────────────────────────────────────────────────────────────────
[tool.coverage.run]
source   = ["src"]
omit     = ["src/mcp/*"]   # MCP server excluded until Phase 5

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under   = 75

# ── ruff ───────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

# ── mypy ───────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version  = "3.11"
strict          = true
ignore_missing_imports = true
